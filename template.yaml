AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Lista de compras serverless con ambientes aislados

Parameters:
  Environment:
    Type: String
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Ambiente que se va a desplegar

Globals:
  Function:
    Runtime: python3.12
    Timeout: 10
    MemorySize: 128
    Tracing: Active

Resources:
  PantryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "pantry-${Environment}-products"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  PantryApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment

  PantryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "pantry-${Environment}-api"
      CodeUri: .
      Handler: function_lambda.lambda_handler
      Environment:
        Variables:
          PANTRY_TABLE: !Ref PantryTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PantryTable
      Events:
        GetMaster:
          Type: HttpApi
          Properties:
            ApiId: !Ref PantryApi
            Path: /master
            Method: GET
        GetShopping:
          Type: HttpApi
          Properties:
            ApiId: !Ref PantryApi
            Path: /shopping
            Method: GET
        CreateProduct:
          Type: HttpApi
          Properties:
            ApiId: !Ref PantryApi
            Path: /products
            Method: POST
        MarkNeeded:
          Type: HttpApi
          Properties:
            ApiId: !Ref PantryApi
            Path: /products/{id}/need
            Method: POST
        MarkBought:
          Type: HttpApi
          Properties:
            ApiId: !Ref PantryApi
            Path: /products/{id}/bought
            Method: POST
        Options:
          Type: HttpApi
          Properties:
            ApiId: !Ref PantryApi
            Path: /{proxy+}
            Method: OPTIONS

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "pantry-${Environment}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "pantry-${Environment}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
        # Rutas de una SPA: cualquier ruta no encontrada regresa index.html
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  ApiUrl:
    Description: URL base de la API del ambiente
    Value: !Sub "https://${PantryApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${Environment}"
  TableName:
    Description: Tabla DynamoDB del ambiente
    Value: !Ref PantryTable
  FunctionName:
    Description: Nombre de la Lambda del ambiente
    Value: !Ref PantryFunction
  FrontendBucketName:
    Description: Bucket S3 donde se sube el build del frontend
    Value: !Ref FrontendBucket
  FrontendUrl:
    Description: URL pública de la PWA (CloudFront)
    Value: !Sub "https://${FrontendDistribution.DomainName}"
  FrontendDistributionId:
    Description: ID de la distribución CloudFront (para invalidar caché)
    Value: !Ref FrontendDistribution