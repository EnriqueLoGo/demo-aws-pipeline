name: Demo AWS Pipeline - Despliegue automático

on:
  push:
    branches: [main]

jobs:
  desplegar-en-aws:
    runs-on: ubuntu-latest

    steps:
      - name: Tomar el código
        uses: actions/checkout@v4

      - name: Configurar acceso a AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Empaquetar y desplegar la función Lambda
        shell: bash
        run: |
          set -euo pipefail

          zip -j function_lambda.zip function_lambda.py

          if aws lambda get-function --function-name Demo-Desde-GitHub > /dev/null 2>&1; then
            echo "La función ya existe; actualizando su código."
            aws lambda update-function-code \
              --function-name Demo-Desde-GitHub \
              --zip-file fileb://function_lambda.zip
          else
            echo "La función no existe; creándola."
            aws lambda create-function \
              --function-name Demo-Desde-GitHub \
              --runtime python3.12 \
              --role arn:aws:iam::112036182812:role/LambdaExecutionRole \
              --handler function_lambda.lambda_handler \
              --zip-file fileb://function_lambda.zip
          fi

      - name: Listo
        run: |
          echo "=========================================="
          echo "El pipeline terminó correctamente."
          echo "Se conectó a AWS y desplegó el código."
          echo "=========================================="
