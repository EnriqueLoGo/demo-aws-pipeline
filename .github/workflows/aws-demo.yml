name: Despliegue de Pantry API

on:
  push:
    branches: [dev, staging, main]

permissions:
  id-token: write   # ✅ REQUERIDO para OIDC — solicita el certificado
  contents: read

jobs:
  desplegar:
    name: Desplegar en ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    env:
      DEPLOY_ENV: ${{ github.ref_name == 'main' && 'prod' || github.ref_name }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: 🔑 ENTRAR A AWS SIN CLAVES — OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::112036182812:role/GitHubActionsOIDCRole
          aws-region: us-east-1

      - name: Validar infraestructura
        run: sam validate --template-file template.yaml --lint

      - name: Construir aplicación
        run: sam build --template-file template.yaml

      - name: Desplegar infraestructura y aplicación
        run: sam deploy --config-env "$DEPLOY_ENV"

      - name: Mostrar URL de la API
        run: |
          aws cloudformation describe-stacks \
            --stack-name "pantry-$DEPLOY_ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Obtener outputs del stack para el frontend
        id: stack_outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name "pantry-$DEPLOY_ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "pantry-$DEPLOY_ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text)
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "pantry-$DEPLOY_ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" \
            --output text)
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "bucket_name=$BUCKET_NAME" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DISTRIBUTION_ID" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Construir frontend (PWA)
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.stack_outputs.outputs.api_url }}
        run: npm run build

      - name: Subir frontend a S3
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.stack_outputs.outputs.bucket_name }}" --delete

      - name: Invalidar caché de CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack_outputs.outputs.distribution_id }}" \
            --paths "/*"

      - name: Mostrar URL del frontend
        run: |
          aws cloudformation describe-stacks \
            --stack-name "pantry-$DEPLOY_ENV" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text